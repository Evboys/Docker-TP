# Version du format Compose
services:
  # BACKEND : API Node.js/Express + pont WebSocket -> TCP vers le game server
  backend:
    build:
      context: ./back              # dossier contenant le Dockerfile du back
      dockerfile: Dockerfile
    environment:                   # variables injectées depuis .env
      - PORT=${BACKEND_PORT}
      - NODE_ENV=${NODE_ENV}
      - GAMESERVER_HOST=game_server    # nom DNS du service sur back_net
      - GAMESERVER_PORT=${GAMESERVER_PORT}
    networks:
      - front_net                  # joignable par nginx
      - back_net                   # joint le game server
    deploy:
      resources:
        limits:                    
          cpus: ${BACK_CPUS}
          memory: ${BACK_MEM}
        reservations:              # minimum garanti
          cpus: '0.10'
          memory: 64M
    healthcheck:                   
      test: ["CMD-SHELL", "node -e \"require('net').connect(${BACKEND_PORT},'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      game_server:
        condition: service_healthy # le backend a besoin du game server, pas l'inverse
    stop_signal: SIGTERM           # signal d'arrêt intercepté par server.js
    stop_grace_period: 10s         # délai avant SIGKILL

  # FRONTEND : Nginx (fichiers statiques + reverse proxy /ws)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: cloud_frontend
    ports:
      - "${FRONT_HOST_PORT}:8080"  # SEUL port publié : hôte:80 -> conteneur:8080
    environment:
      - BACKEND_HOST=backend       # utilisés par envsubst dans l'entrypoint
      - BACKEND_PORT=${BACKEND_PORT}
    networks:
      - front_net                  
    volumes:
      - front_logs:/var/log/nginx  # logs persistants
    deploy:
      resources:
        limits:
          cpus: ${FRONT_CPUS}
          memory: ${FRONT_MEM}
        reservations:
          cpus: '0.05'
          memory: 32M
    depends_on:
      backend:
        condition: service_healthy # démarre quand l'API est prête
    stop_signal: SIGTERM
    stop_grace_period: 5s

  # GAME SERVER : socat + bash, TCP 7777
  game_server:
    build:
      context: ./gameserver
      dockerfile: Dockerfile
    container_name: cloud_gameserver
    # Pas de "ports:" : seul le backend (via back_net) peut l'atteindre.
    # Pour tester depuis l'hôte, retirer "internal: true" plus bas et ajouter :
    #   ports: ["127.0.0.1:7777:7777"]
    environment:
      - MAX_PLAYERS=${MAX_PLAYERS}
      - TICK_RATE=${TICK_RATE}
      - GAMESERVER_PORT=${GAMESERVER_PORT}
    networks:
      - back_net
    volumes:
      - game_data:/data            # l'état de la partie survit aux redémarrages
    deploy:
      resources:
        limits:
          cpus: ${GAME_CPUS}
          memory: ${GAME_MEM}
        reservations:
          cpus: '0.20'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${GAMESERVER_PORT} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    stop_signal: SIGTERM
    stop_grace_period: 15s

# --- CONSIGNE SUPPLEMENTAIRE : CI/CD (Lint) ---
  # Ce conteneur éphémère vérifie la syntaxe des scripts bash avant même que les services démarrent.
  ci_lint:
    image: alpine:3.19
    container_name: ci_lint
    command: /bin/sh -c "apk add --no-cache shellcheck && shellcheck /src/front/entrypoint.sh /src/gameserver/server.sh /src/gameserver/handler.sh"
    volumes:
      - .:/src:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '64M'

  # --- CONSIGNE SUPPLEMENTAIRE : CI/CD (Test) ---
  # Ce conteneur éphémère vérifie que le frontend répond bien en HTTP 200 une fois démarré.
  ci_test:
    image: alpine:3.19
    container_name: ci_test
    command: /bin/sh -c "apk add --no-cache curl && echo 'Test du Frontend...' && curl -s -o /dev/null -w '%{http_code}' http://frontend:8080 | grep 200 && echo 'Test OK' || (echo 'Echec du test' && exit 1)"
    networks:
      - front_net
    depends_on:
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '64M'

# --- CONSIGNE SUPPLÉMENTAIRE : Scaling ---
  autoscaler:
    build:
      context: ./scaler
      dockerfile: Dockerfile
    container_name: cloud_autoscaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Accès au démon Docker hôte
      - .:/src:ro # Accès au docker-compose.yml
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: '64M'
    restart: unless-stopped

# RÉSEAUX : segmentation pour sécuriser les ports
networks:
  front_net:                       # frontend <-> backend
    driver: bridge
  back_net:                        # backend <-> game_server
    driver: bridge
    internal: true                 # aucun accès Internet / hôte depuis ce réseau

# Volumes nommés
volumes:
  game_data:                       # données persistantes du game server
  front_logs:                      # logs Nginx