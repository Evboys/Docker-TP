version: '3.8'

services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: cloud_backend
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    stop_signal: SIGTERM
    stop_grace_period: 10s

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: cloud_frontend
    ports:
      - "80:8080"
    environment:
      - BACKEND_HOST=backend
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    depends_on:
      backend:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 5s

  game_server:
    build:
      context: ./gameserver
      dockerfile: Dockerfile
    container_name: cloud_gameserver
    ports:
      - "7777:7777"
    environment:
      - MAX_PLAYERS=32
      - TICK_RATE=64
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 15s

networks:
  internal_net:
    driver: bridge
