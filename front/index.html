<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Docker Cloud - Frontend</title>
</head>
<body>
    <h1>Bienvenue sur Docker Cloud</h1>
    <p>Frontend opérationnel running on Nginx.</p>

    <button onclick="appelerApi()">Appeler le backend</button>
    <p id="reponse">Pas encore de réponse.</p>

    <script>
        async function appelerApi() {
            try {
                const res = await fetch('/api');
                const data = await res.json();
                document.getElementById('reponse').textContent =
                    data.status + ' - ' + data.message;
            } catch (e) {
                document.getElementById('reponse').textContent = 'Erreur : ' + e;
            }
        }
    </script>
</body>
</html>
